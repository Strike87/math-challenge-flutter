name: Practice visual review
on:
  pull_request:
    paths:
      - 'lib/screens/practice_screen.dart'
      - 'lib/screens/practice_style_screen.dart'
      - 'lib/widgets/setup_header.dart'
      - 'lib/widgets/setup_word_fit_text.dart'
      - 'test/practice_visual_review_test.dart'
      - '.github/workflows/practice-visual-review.yml'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test test/practice_visual_review_test.dart
        env:
          CAPTURE_SETUP_PREVIEWS: '1'
      - name: Verify screenshot count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('build/setup-previews').glob('practice-*.png'))
          assert len(files) == 32, f'Expected 32 screenshots, found {len(files)}'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-visual-previews
          path: build/setup-previews/practice-*.png
          if-no-files-found: warn
          retention-days: 7
