name: TC-05D D2 Frozen Canonical Golden Generation

on:
  push:
    branches:
      - feature/target-clash-tc05d-controlled-goldens
    paths:
      - .github/workflows/tc05d_d2_golden_generation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-golden-generation:
    name: TC-05D D2 Canonical Golden Generation
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout TC-05D branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify expected harness commit ancestry
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_PARENT="a1c62f73c73e1244205a6bf29e0a9c7e5dc2f26e"

          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -f test/target_clash_tc_05d_golden_test.dart

          echo "HARNESS_PARENT=PASS"
          echo "HARNESS_PATH=PASS"

      - name: Host Docker capability
        shell: bash
        run: |
          set -euo pipefail

          docker --version
          docker buildx version
          docker info --format '{{.OSType}} / {{.Architecture}}'

      - name: Verify pinned OCI index and linux-amd64 manifest
        shell: bash
        run: |
          set -euo pipefail

          INDEX_DIGEST="sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3"
          AMD64_DIGEST="sha256:496754492fb28b4d3049432f2ca787449331e23fb14f0dd3fffea86bf5a93eb4"

          docker buildx imagetools inspect "ubuntu@${INDEX_DIGEST}" --raw \
            > "$RUNNER_TEMP/tc05d_ubuntu_index.json"

          jq -e --arg digest "$AMD64_DIGEST" '
            .manifests[]
            | select(
                .platform.os == "linux"
                and .platform.architecture == "amd64"
                and .digest == $digest
              )
          ' "$RUNNER_TEMP/tc05d_ubuntu_index.json" > /dev/null

          echo "OCI_INDEX_VERIFY=PASS"
          echo "OCI_AMD64_MANIFEST_VERIFY=PASS"

      - name: Generate canonical Target Clash goldens in frozen runtime
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ubuntu@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3"

          mkdir -p "$RUNNER_TEMP/tc05d-artifact"

          docker run --rm \
            --platform linux/amd64 \
            -e SOURCE_HEAD="$GITHUB_SHA" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP:/runner-temp" \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail

              exec > >(tee /runner-temp/tc05d_generation_log.txt) 2>&1

              echo "=== TC-05D D2 FROZEN CANONICAL GOLDEN GENERATION ==="

              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                curl \
                git \
                jq \
                libglu1-mesa \
                unzip \
                xz-utils

              rm -rf /var/lib/apt/lists/*

              if [ "$(uname -m)" != "x86_64" ]; then
                echo "FAIL: expected x86_64"
                exit 20
              fi

              FLUTTER_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz"
              FLUTTER_SHA="2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb"

              echo
              echo "=== DOWNLOAD / VERIFY OFFICIAL FLUTTER ==="

              curl --fail --location --retry 3 \
                "$FLUTTER_URL" \
                --output /tmp/flutter.tar.xz

              echo "${FLUTTER_SHA}  /tmp/flutter.tar.xz" \
                | sha256sum --check -

              mkdir -p /opt/flutter-sdk

              tar -xJf /tmp/flutter.tar.xz \
                -C /opt/flutter-sdk \
                --strip-components=1

              export PATH="/opt/flutter-sdk/bin:$PATH"

              git config --global --add safe.directory /opt/flutter-sdk

              flutter --version
              flutter --version --machine > /tmp/flutter-version.json
              cat /tmp/flutter-version.json

              test "$(jq -r .frameworkVersion /tmp/flutter-version.json)" = "3.47.5"
              test "$(jq -r .channel /tmp/flutter-version.json)" = "stable"
              test "$(jq -r .frameworkRevision /tmp/flutter-version.json)" = "6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
              test "$(jq -r .engineRevision /tmp/flutter-version.json)" = "af7e796e161ae0bb1ff0758c71a7105418bd9ded"

              DART_MACHINE="$(jq -r .dartSdkVersion /tmp/flutter-version.json)"

              case "$DART_MACHINE" in
                3.13.4*) ;;
                *)
                  echo "FAIL: unexpected Dart SDK: $DART_MACHINE"
                  exit 21
                  ;;
              esac

              test "$(cat /opt/flutter-sdk/bin/internal/engine.version)" = \
                "af7e796e161ae0bb1ff0758c71a7105418bd9ded"

              dart --version 2>&1 | tee /tmp/dart-version.txt

              grep -F "Dart SDK version: 3.13.4" \
                /tmp/dart-version.txt

              echo
              echo "=== VERIFY FROZEN FONT AUTHORITY ==="

              check_font() {
                expected="$1"
                path="$2"
                echo "${expected}  ${path}" | sha256sum --check -
              }

              check_font \
                A4C5BC453CA281D90EA079E596DA7AE0DFEB5777497C29EC254E76D97FF6F890 \
                /workspace/assets/fonts/Baloo2-Bold.ttf

              check_font \
                A4C5BC453CA281D90EA079E596DA7AE0DFEB5777497C29EC254E76D97FF6F890 \
                /workspace/assets/fonts/Baloo2-ExtraBold.ttf

              check_font \
                A4C5BC453CA281D90EA079E596DA7AE0DFEB5777497C29EC254E76D97FF6F890 \
                /workspace/assets/fonts/Baloo2-Black.ttf

              check_font \
                57F73E11F51999432BF7AB22CE55B6F945D5ECA1BF824404CFA9EC2E3718C84E \
                /workspace/assets/fonts/PlusJakartaSans-Medium.ttf

              check_font \
                A4C5BC453CA281D90EA079E596DA7AE0DFEB5777497C29EC254E76D97FF6F890 \
                /workspace/assets/fonts/PlusJakartaSans-SemiBold.ttf

              check_font \
                A4C5BC453CA281D90EA079E596DA7AE0DFEB5777497C29EC254E76D97FF6F890 \
                /workspace/assets/fonts/PlusJakartaSans-Bold.ttf

              check_font \
                A4C5BC453CA281D90EA079E596DA7AE0DFEB5777497C29EC254E76D97FF6F890 \
                /workspace/assets/fonts/PlusJakartaSans-ExtraBold.ttf

              check_font \
                32F5840FB2BF844BDABAFE372591DDFB9286E98117F5B21950AAF54EA856919A \
                /workspace/assets/fonts/OpenDyslexic-Regular.otf

              echo "FONT_HASH_COUNT=8"
              echo "FONT_HASHES_VERIFIED=PASS"

              echo
              echo "=== PREPARE EPHEMERAL WRITABLE REPOSITORY COPY ==="

              mkdir -p /work
              cp -a /workspace/. /work/
              cd /work

              git config --global --add safe.directory /work

              mkdir -p test/goldens/target_clash

              flutter pub get

              echo
              echo "=== GENERATION PASS 1 ==="

              flutter test \
                --update-goldens \
                --reporter expanded \
                test/target_clash_tc_05d_golden_test.dart

              mapfile -t GOLDENS < <(
                find test/goldens/target_clash \
                  -maxdepth 1 \
                  -type f \
                  -name "tc05d_*.png" \
                  -printf "%f\n" \
                  | sort
              )

              EXPECTED=(
                tc05d_01_gameplay_open_light_390x844.png
                tc05d_02_clash_reveal_light_390x844.png
                tc05d_03_gameplay_open_dark_390x844.png
                tc05d_04_power_shot_ready_390x844.png
                tc05d_05_triple_power_shot_blocked_390x844.png
                tc05d_06_results_light_390x844.png
                tc05d_07_results_dark_390x844.png
                tc05d_08_results_landscape_844x390.png
                tc05d_09_technical_failure_390x844.png
                tc05d_10_gameplay_tablet_834x1194.png
              )

              test "${#GOLDENS[@]}" -eq 10

              for i in "${!EXPECTED[@]}"; do
                test "${GOLDENS[$i]}" = "${EXPECTED[$i]}"
              done

              sha256sum test/goldens/target_clash/tc05d_*.png \
                | sort -k2 \
                > /tmp/tc05d_pass1.sha256

              cat /tmp/tc05d_pass1.sha256

              mkdir -p /tmp/tc05d_pass1

              cp test/goldens/target_clash/tc05d_*.png \
                /tmp/tc05d_pass1/

              rm -f test/goldens/target_clash/tc05d_*.png

              echo
              echo "=== GENERATION PASS 2 / DETERMINISM PROOF ==="

              flutter test \
                --update-goldens \
                --reporter expanded \
                test/target_clash_tc_05d_golden_test.dart

              mapfile -t GOLDENS2 < <(
                find test/goldens/target_clash \
                  -maxdepth 1 \
                  -type f \
                  -name "tc05d_*.png" \
                  -printf "%f\n" \
                  | sort
              )

              test "${#GOLDENS2[@]}" -eq 10

              for i in "${!EXPECTED[@]}"; do
                test "${GOLDENS2[$i]}" = "${EXPECTED[$i]}"
              done

              sha256sum test/goldens/target_clash/tc05d_*.png \
                | sort -k2 \
                > /tmp/tc05d_pass2.sha256

              diff -u \
                /tmp/tc05d_pass1.sha256 \
                /tmp/tc05d_pass2.sha256

              for f in test/goldens/target_clash/tc05d_*.png; do
                base="$(basename "$f")"
                cmp "/tmp/tc05d_pass1/$base" "$f"
              done

              echo "GOLDEN_DETERMINISM_TWO_PASS=PASS"

              echo
              echo "=== COPY CANONICAL ARTIFACTS ==="

              mkdir -p /runner-temp/tc05d-artifact/goldens

              cp test/goldens/target_clash/tc05d_*.png \
                /runner-temp/tc05d-artifact/goldens/

              cp /tmp/tc05d_pass2.sha256 \
                /runner-temp/tc05d-artifact/tc05d_goldens.sha256

              {
                echo "TC_05D_D2_CANONICAL_GOLDEN_GENERATION=PASS"
                echo "SOURCE_HEAD=${SOURCE_HEAD}"
                echo "BASE_IMAGE_INDEX_DIGEST=sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3"
                echo "BASE_IMAGE_AMD64_MANIFEST_DIGEST=sha256:496754492fb28b4d3049432f2ca787449331e23fb14f0dd3fffea86bf5a93eb4"
                echo "PLATFORM=linux/amd64"
                echo "FLUTTER_VERSION=3.47.5"
                echo "FLUTTER_FRAMEWORK_REVISION=6a19cca56475dbfba1478ee68d7bd0c2ef891da1"
                echo "FLUTTER_ENGINE_REVISION=af7e796e161ae0bb1ff0758c71a7105418bd9ded"
                echo "DART_VERSION=3.13.4"
                echo "FLUTTER_ARCHIVE_SHA256=${FLUTTER_SHA}"
                echo "FONT_HASH_COUNT=8"
                echo "DPR=1.0"
                echo "LOCALE=en"
                echo "TEXT_SCALE=1.0"
                echo "GOLDEN_COUNT=10"
                echo "GOLDEN_DETERMINISM_TWO_PASS=PASS"
                echo "REPOSITORY_COMMIT_MUTATION=NOT_PERFORMED"
              } > /runner-temp/tc05d-artifact/tc05d_generation_manifest.txt

              echo
              echo "=== FINAL D2 PROOF ==="

              cat /runner-temp/tc05d-artifact/tc05d_generation_manifest.txt
            '

      - name: Verify checked-out repository remained unmodified
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "FAIL: source checkout mutated."
            exit 30
          fi

          echo "SOURCE_REPOSITORY_MUTATION=NONE"

      - name: Verify canonical artifact payload
        shell: bash
        run: |
          set -euo pipefail

          test -f "$RUNNER_TEMP/tc05d-artifact/tc05d_goldens.sha256"
          test -f "$RUNNER_TEMP/tc05d-artifact/tc05d_generation_manifest.txt"

          count="$(
            find "$RUNNER_TEMP/tc05d-artifact/goldens" \
              -maxdepth 1 \
              -type f \
              -name "tc05d_*.png" \
              | wc -l
          )"

          test "$count" -eq 10

          echo "ARTIFACT_GOLDEN_COUNT=10"
          echo "ARTIFACT_PAYLOAD_VERIFY=PASS"

      - name: Upload TC-05D D2 canonical golden artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc05d-d2-canonical-goldens
          path: |
            ${{ runner.temp }}/tc05d-artifact/
            ${{ runner.temp }}/tc05d_generation_log.txt
          if-no-files-found: error
          retention-days: 14