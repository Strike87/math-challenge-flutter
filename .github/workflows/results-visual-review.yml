name: Results visual review
on:
  pull_request:
    paths:
      - 'lib/widgets/modals.dart'
      - 'lib/widgets/setup_word_fit_text.dart'
      - 'test/results_visual_review_test.dart'
      - '.github/workflows/results-visual-review.yml'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test test/results_visual_review_test.dart
        env:
          CAPTURE_SETUP_PREVIEWS: '1'
      - name: Verify screenshot count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('build/setup-previews').glob('results-*.png'))
          assert len(files) == 32, f'Expected 32 screenshots, found {len(files)}'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-visual-previews
          path: build/setup-previews/results-*.png
          if-no-files-found: warn
          retention-days: 7
